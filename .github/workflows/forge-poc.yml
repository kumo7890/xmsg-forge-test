name: Forge PoC — Xmsg Sender Forgery

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  forge-poc:
    name: ORMP Port-Layer Auth Bypass PoC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"
          forge install foundry-rs/forge-std

      - name: Build
        run: forge build

      - name: Unit tests — no RPC needed
        run: |
          forge test \
            --match-test "testPayloadAlignment" \
            -vvvv

      - name: Offline alignment proof — no RPC needed
        run: |
          forge test \
            --match-test "testSenderReporter_ConfirmsAssemblyPattern" \
            -vvvv

      - name: Confirm ORMP relay on-chain
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          cast call \
            0x2cd1867Fb8016f93710B6386f7f9F1D540A60812 \
            "ormp()(address)" \
            --rpc-url "$ETH_RPC_URL" || \
            echo "WARNING: relay read failed"

      - name: Confirm registered peer for Arbitrum
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          cast call \
            0x2cd1867Fb8016f93710B6386f7f9F1D540A60812 \
            "peerOf(uint256)(address)" 42161 \
            --rpc-url "$ETH_RPC_URL" || \
            echo "WARNING: peer read failed"

      - name: Fork tests — CRITICAL PoC
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          forge test \
            --match-test "testForge_ORMPPort_v13" \
            --fork-url "$ETH_RPC_URL" \
            -vvvv

      - name: Fork tests — sender reporter
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          forge test \
            --match-test "testSenderReporter_ConfirmsAssemblyPattern" \
            --fork-url "$ETH_RPC_URL" \
            -vvvv